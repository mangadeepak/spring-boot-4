application.welcome.message=Hello World!!!
spring.application.name=mycoolapp

#Either specify what end points to expose or else use * to include all such endpoints (Eg: beans, threaddump,mappings)
#management.endpoints.web.exposure.include=health,info
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=health,info
management.info.env.enabled=true

info.app.name=My Super Cool App
info.app.description=My first SpringBoot App.
info.app.version=1.0.0

spring.security.user.name=admin
spring.security.user.password=admin

server.port=7070
server.servlet.context-path=/mycoolapp

#spring.main.lazy-initialization=true